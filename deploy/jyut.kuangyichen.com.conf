limit_req_zone $binary_remote_addr zone=jyut_tts_per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=jyut_sync_login_per_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=jyut_sync_per_ip:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name jyut.kuangyichen.com;
    return 301 https://jyut.kuangyichen.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jyut.kuangyichen.com;

    ssl_certificate     /root/config/live/kuangyichen.com/fullchain.pem;
    ssl_certificate_key /root/config/live/kuangyichen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/jyut-live;
    index index.html;

    access_log /usr/local/nginx/logs/jyut.kuangyichen.com.access.log;
    error_log  /usr/local/nginx/logs/jyut.kuangyichen.com.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /release.json {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location = /api/tts/health {
        limit_req zone=jyut_tts_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /api/tts {
        limit_req zone=jyut_tts_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
    }

    location = /api/account/login {
        limit_req zone=jyut_sync_login_per_ip burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8788/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location /api/account/ {
        limit_req zone=jyut_sync_per_ip burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8788/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /sw.js {
        try_files $uri =404;
        expires -1;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        expires -1;
    }

    location ~* \.(css|js)$ {
        try_files $uri =404;
        expires 1h;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|webp|svg|woff|woff2)$ {
        try_files $uri =404;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
}
