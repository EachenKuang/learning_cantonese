name: ci
on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: 语法检查
        run: |
          node --check js/data.js
          node --check js/songs.js
          node --check js/lessons.js
          node --check js/stories.js
          node --check js/app.js
          node --check sw.js
          bash -n deploy/deploy-jyut-clean.sh
      - name: 数据完整性校验
        run: node scripts/verify-data.mjs
      - name: 后端同步逻辑测试
        run: |
          node --check server/sync-store.mjs
          node --check server/sync-server.mjs
          node --check server/backup-store.mjs
          node --test server/sync-store.test.mjs

  promote:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: 滚动更新 ci-ok tag
        run: |
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "main 已有更新提交，跳过旧版本晋级：$GITHUB_SHA"
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/tags/ci-ok" --force
